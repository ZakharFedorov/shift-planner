# Local development database only. Started automatically by spring-boot-docker-compose
# when the application runs from the IDE. Credentials are for local development only.
services:
  postgres:
    image: 'postgres:18'
    environment:
      POSTGRES_DB: shiftplanner
      POSTGRES_USER: shiftplanner
      POSTGRES_PASSWORD: shiftplanner-dev
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
